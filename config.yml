# CircleCI for webhook-relay-queue
# Python 3.12, standard library at runtime, pytest only for the suite.
# Same commands as .github/workflows/ci.yml - keep them in step.

version: 2.1

executors:
  py312:
    docker:
      - image: cimg/python:3.12
    working_directory: ~/project

commands:
  install-deps:
    description: Install runtime and test dependencies into the pyenv interpreter
    steps:
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "requirements.txt" }}
            - pip-v1-
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
            python -m pip install pytest pytest-cov
      - save_cache:
          key: pip-v1-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip

jobs:
  structure-guard:
    description: src/ ships, tests/ proves it - fail fast if that slips
    executor: py312
    steps:
      - checkout
      - run:
          name: Check the src/ and tests/ contract
          command: sh scripts/structure-guard.sh

  test:
    executor: py312
    steps:
      - checkout
      - install-deps
      - run:
          name: Run the suite
          command: |
            mkdir -p reports
            python -m pytest tests/ -v \
              --junitxml=reports/junit.xml \
              --cov=src --cov-report=term-missing \
              --cov-report=xml:reports/coverage.xml
      - store_test_results:
          path: reports
      - store_artifacts:
          path: reports
          destination: test-reports

workflows:
  build-and-test:
    jobs:
      - structure-guard
      - test:
          requires:
            - structure-guard
